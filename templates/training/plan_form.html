{% extends "base.html" %}

{% block title %}编辑训练计划 - 乒乓球运动员综合训练监控管理系统{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{{ url_for('training.plans') }}" class="btn btn-outline-secondary">&larr; 返回列表</a>
    <h1 class="page-title h3 mb-0">编辑训练计划</h1>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="athlete_id" class="form-label">运动员</label>
                    <select class="form-select" id="athlete_id" name="athlete_id" required>
                        {% for athlete in athletes %}
                        <option value="{{ athlete.id }}" {% if athlete.id == plan.athlete_id %}selected{% endif %}>{{ athlete.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="coach_id" class="form-label">教练</label>
                    <select class="form-select" id="coach_id" name="coach_id" required>
                        {% for coach in coaches %}
                        <option value="{{ coach.id }}" {% if coach.id == plan.coach_id %}selected{% endif %}>{{ coach.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="plan_datetime" class="form-label">训练日期</label>
                    <input type="datetime-local" class="form-control" id="plan_datetime" name="plan_datetime" value="{{ plan.plan_datetime }}" required>
                </div>
                <div class="col-md-6">
                    <label for="intensity" class="form-label">强度</label>
                    <select class="form-select" id="intensity" name="intensity">
                        <option value="低" {% if plan.intensity == '低' %}selected{% endif %}>低</option>
                        <option value="中" {% if plan.intensity == '中' %}selected{% endif %}>中</option>
                        <option value="高" {% if plan.intensity == '高' %}selected{% endif %}>高</option>
                        <option value="极高" {% if plan.intensity == '极高' %}selected{% endif %}>极高</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="duration" class="form-label">时长（分钟）</label>
                    <input type="number" class="form-control" id="duration" name="duration" value="{{ plan.duration }}" min="1">
                </div>
                <div class="col-md-6">
                    <label for="location" class="form-label">地点</label>
                    <input type="text" class="form-control" id="location" name="location" value="{{ plan.location }}">
                </div>
                <div class="col-md-6">
                    <label for="plan_status" class="form-label">计划状态</label>
                    <select class="form-select" id="plan_status" name="plan_status">
                        {% for option in plan_status_options %}
                        <option value="{{ option.value }}" {% if option.value == plan.get('status', 'published') %}selected{% endif %}>{{ option.label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <label for="content" class="form-label">训练内容</label>
                    <textarea class="form-control" id="content" name="content" rows="3" required>{{ plan.content }}</textarea>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">更新</button>
                    <a href="{{ url_for('training.plans') }}" class="btn btn-secondary">取消</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
