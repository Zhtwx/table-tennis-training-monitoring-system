<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 乒乓球运动员综合训练监控管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(15, 61, 102, .94), rgba(23, 105, 170, .86)),
                url("https://images.unsplash.com/photo-1611251135345-18c56206b863?auto=format&fit=crop&w=1800&q=80");
            background-size: cover;
            background-position: center;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }

        .login-shell {
            min-height: 100vh;
        }

        .login-card {
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, .24);
            background: rgba(255, 255, 255, .94);
            border-radius: 8px;
        }

        .brand-mark {
            width: 48px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #1769aa;
            color: #fff;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <main class="login-shell d-flex align-items-center justify-content-center p-3">
        <div class="login-card shadow-lg p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-mark mb-3">TT</div>
                <h1 class="h3 fw-bold mb-2">乒乓球训练监控系统</h1>
                <p class="text-secondary mb-0">请登录您的账户进入系统</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username"
                           placeholder="请输入用户名" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password"
                           placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">登录系统</button>
            </form>

            <div class="mt-4 p-3 bg-light rounded-3 text-secondary small">
                <div>管理员账号：admin / admin123</div>
                <div>普通用户账号：coach / user123</div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
