{% extends "base.html" %}

{% block title %}新增运动员 - 乒乓球运动员综合训练监控管理系统{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{{ url_for('players.list') }}" class="btn btn-outline-secondary btn-sm">返回</a>
    <div>
        <h1 class="page-title h3 mb-1">新增运动员</h1>
        <p class="text-secondary mb-0">建立运动员基础档案，包含基本信息、竞技特征和健康状态。</p>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-white border-0 pt-4 px-4">
        <h2 class="h5 mb-1">运动员信息</h2>
        <p class="text-secondary small mb-0">学号、姓名、性别、年龄和运动等级为必填项。</p>
    </div>
    <div class="card-body">
        <form method="post" action="{{ url_for('players.create') }}" class="row g-3">
            {% include "players/_form.html" %}
            <div class="col-12 d-flex justify-content-end gap-2 border-top pt-3">
                <a href="{{ url_for('players.list') }}" class="btn btn-outline-secondary">取消</a>
                <button type="submit" class="btn btn-primary">创建档案</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
